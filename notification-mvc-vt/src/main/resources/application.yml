server:
  port: 8081

spring:
  application:
    name: notification-mvc-vt

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX:320}
          max-idle: ${REDIS_POOL_MAX:320}
          min-idle: ${REDIS_POOL_MIN_IDLE:300}
          time-between-eviction-runs: 1s

logging:
  level:
    root: INFO