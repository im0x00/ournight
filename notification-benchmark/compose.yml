name: notification-benchmark

services:
  redis:
    image: redis:7.4
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "400mb", "--maxmemory-policy", "noeviction"]
    cpus: ${REDIS_CPUS:-2.0}
    mem_limit: ${REDIS_MEM:-512m}
    memswap_limit: ${REDIS_MEM:-512m}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"   # load generator XADDs from the host

  mvc-vt:
    image: notification-mvc-vt
    build:
      context: ..
      dockerfile: notification-mvc-vt/Dockerfile
      args:
        JAR_FILE: notification-mvc-vt/build/libs/mvc-vt.jar
    # same resources as the webflux services, so the comparison only differs in the thread model
    cpus: ${NOTI_CPUS:-2.0}
    mem_limit: ${NOTI_MEM:-768m}
    memswap_limit: ${NOTI_MEM:-768m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "18081:8081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_POOL_MAX: ${REDIS_POOL_MAX:-320}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-300}
    depends_on:
      redis:
        condition: service_healthy

  webflux-reactor:
    image: notification-webflux-reactor
    build:
      context: ..
      dockerfile: notification-webflux-reactor/Dockerfile
      args:
        JAR_FILE: notification-webflux-reactor/build/libs/webflux-reactor.jar
    cpus: ${NOTI_CPUS:-2.0}
    mem_limit: ${NOTI_MEM:-768m}
    memswap_limit: ${NOTI_MEM:-768m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "18083:8083"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NOTIFICATION_READER: ${NOTIFICATION_READER:-per-subscription}
      REDIS_POOL_ENABLED: ${REDIS_POOL_ENABLED:-false}
      REDIS_POOL_MAX: ${REDIS_POOL_MAX:-16}
      POLL_TIMEOUT: ${POLL_TIMEOUT:-2s}
    depends_on:
      redis:
        condition: service_healthy

  webflux-coroutine:
    image: notification-webflux-coroutine
    build:
      context: ..
      dockerfile: notification-webflux-coroutine/Dockerfile
      args:
        JAR_FILE: notification-webflux-coroutine/build/libs/webflux-coroutine.jar
    cpus: ${NOTI_CPUS:-2.0}
    mem_limit: ${NOTI_MEM:-768m}
    memswap_limit: ${NOTI_MEM:-768m}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "18084:8084"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_POOL_MAX: ${REDIS_POOL_MAX:-320}
      REDIS_POOL_MIN_IDLE: ${REDIS_POOL_MIN_IDLE:-300}
    depends_on:
      redis:
        condition: service_healthy
