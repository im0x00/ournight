server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.ournight.pos: DEBUG
    org.springframework.web: INFO
    org.springframework.data.redis: INFO
    org.springframework.r2dbc: INFO

  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n%rootException"