spring:
  devtools:
    restart:
      enabled: false
  application:
    name: api-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false # 필수! 없으면 SSE 연결시 connectionpool고갈됨
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{requestId:-}] %-5level %logger{36} - %msg%n"
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 3600000       # 1시간 (ms)
  refresh-token-validity: 604800000    # 7일 (ms)

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/auth/callback}
  client-secret: ${KAKAO_CLIENT_SECRET}

app:
  client:
    base-url: ${APP_CLIENT_BASE_URL:https://alpha.ournight.co.kr}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://alpha.ournight.co.kr}

aws:
  s3:
    # 프로덕션 기본 (프로파일 없음). local / alpha 는 각 application-*.yaml 에서 덮어씀
    bucket: ${AWS_S3_BUCKET:ournight-s3-alpha}
    region: ${AWS_REGION:ap-northeast-2}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    domain: ${AWS_S3_DOMAIN:image.ournight.co.kr}
