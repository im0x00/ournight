server:
  port: 8083

spring:
  application:
    name: notification-webflux-reactor

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      lettuce:
        pool:
          # Boot turns the pool on by itself when commons-pool2 is on the classpath → plain must say false
          enabled: ${REDIS_POOL_ENABLED:false}
          max-active: ${REDIS_POOL_MAX:16}
          # max-idle < max-active → connections are closed on return → churn comes back
          max-idle: ${REDIS_POOL_MAX:16}
          min-idle: 0

logging:
  level:
    root: INFO

notification:
  reader: ${NOTIFICATION_READER:per-subscription}   # per-subscription | store-broadcast
  poll-timeout: ${POLL_TIMEOUT:2s}                  # StreamReceiver default; the plain run used 2s
